name: Astro auf GitHub Pages veröffentlichen

on:
  push:
    branches: [redesign]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Qualität prüfen
        run: |
          npm run check
          npm run typecheck
          npm run lint
          npm run format:check

      - name: GitHub-Pages-Build erzeugen
        run: |
          SITE_URL=https://ak-learn-code.github.io \
          BASE_PATH=/Ingenieurbuero-Kaltbrunn \
          npm run build

      - name: Auf gh-pages veröffentlichen
        run: |
          mkdir /tmp/site
          cp -a dist/. /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Astro-Seite aus ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
